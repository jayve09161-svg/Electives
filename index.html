<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="profile.jpg" alt="Profile Picture" class="profile-image">
        <h2 id="name">John Doe</h2>
        <p class="title">Web Developer</p>
        <p class="bio">Passionate about creating interactive applications and experiences on the web.</p>
         <button id = "theme-btn">Switch theme</button>
    </div>
    <script src="java.js"></script>
</body>
</html>
